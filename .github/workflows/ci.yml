name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Lint
        run: just lint

      - name: Build app bundle
        run: just bundle

      - name: Test
        run: just test
