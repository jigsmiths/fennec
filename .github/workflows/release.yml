name: Release

on:
  workflow_run: # after CI passed on main
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch: # publish the latest tag again, after a failed release

permissions:
  contents: write

concurrency: release

jobs:
  tag:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }} # the commit CI tested

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@v3.4.0

      - name: Tag the next version, if the commits call for one
        id: tag
        run: |
          current=$(svu current)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if ! git rev-parse -q --verify "refs/tags/$current" > /dev/null; then
              echo "No tag to release yet"
              exit 1
            fi
            echo "tag=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next=$(svu next --v0)
          if [ "$next" = "$current" ]; then
            echo "No release needed (current: $current)"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: macos-15
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Build and package
        id: package
        run: |
          version="${TAG#v}"
          just package "$version"
          zip=".build/Fennec-$version.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: jigsmiths/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update cask
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        working-directory: tap
        run: |
          cat > Casks/fennec.rb <<EOF
          # This file is generated by the jigsmiths/fennec release workflow. DO NOT EDIT.
          cask "fennec" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/jigsmiths/fennec/releases/download/v#{version}/Fennec-#{version}.zip"
            name "Fennec"
            desc "Fast keyboard-friendly file browser"
            homepage "https://github.com/jigsmiths/fennec"

            livecheck do
              skip "Auto-generated on release."
            end

            depends_on arch: :arm64
            depends_on macos: :sequoia

            app "Fennec.app"

            # Ad-hoc signed only, so skip the Gatekeeper prompt.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/Fennec.app"]
            end

            zap trash: "~/Library/Preferences/dev.bvdwalt.fennec.plist"
          end
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/fennec.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git commit -m "fennec $VERSION"
          git push
